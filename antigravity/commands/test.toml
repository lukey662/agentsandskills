name = "test"
description = "Run unit, regression, and smoke tests. List commands. Screenshots still use browser-qa."

prompt = """
Run the testing-qa playbook.

Canonical source: skills/testing-qa/SKILL.md (or .cursor/skills/testing-qa/SKILL.md). Visual proof: browser-qa. Keyboard: accessibility-wcag. Policies: supabase-auth-rls.

Workflow:
1. Name unit vs regression vs smoke for this change. Do not skip RLS/auth when data is involved.
2. Run the commands that exist in this repo. List each command and the result.
3. Auth/RLS: a negative that fails when another user or anon can read the row.
4. User-visible work still uses browser-qa. Do not treat toBeVisible as a screenshot.

Reject: "tests pass" with no command list; skipping RLS tests because "it's just a table"; replacing browser-qa with this skill.

Required outputs: commands run, pass/fail, coverage gaps, skipped-test rationale.
"""
