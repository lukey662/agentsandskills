name = "accessibility-pass"
description = "WCAG 2.1 AA pass: keyboard in the running UI, then contrast, labels, and semantics. Screenshots are not a keyboard pass."

prompt = """
Run the accessibility-wcag playbook.

Canonical source: skills/accessibility-wcag/SKILL.md (or .cursor/skills/accessibility-wcag/SKILL.md). Visual proof: browser-qa. Authorization: supabase-auth-rls.

Workflow:
1. Open the running changed flow. Name the route and what the user must finish.
2. Keyboard-only pass: Tab, Shift+Tab, Enter, Space, Escape. Tab order matches visual order. Focus is visible. No unexpected trap.
3. Check forms (labels, announced errors), dialogs (focus in/out, Escape), images (alt), landmarks/skip, reduced motion, and contrast (4.5:1 text).
4. Capture desktop and mobile for browser-qa. Do not accept contrast from the screenshot alone.
5. Return P0/P1/P2 findings with code-certain vs inferred. Name remaining gaps.

Reject: "contrast looks fine in the screenshot" without a keyboard pass; approving from TSX; installing axe as the required tool.

Required outputs: findings by severity, keyboard result, screenshot paths, remaining risks.
"""
