name = "ship"
description = "Release go / no-go. Env, migrations, rollback, commands, browser-qa paths."

prompt = """
Run the ship playbook.

Canonical source: skills/ship/SKILL.md (or .cursor/skills/ship/SKILL.md). Commands: testing-qa. Visual proof: browser-qa. Keyboard: accessibility-wcag. Schema: postgres-migrations. Secrets: owasp-security-review / supabase-auth-rls.

Workflow:
1. Name the target (preview / production) and what is going out.
2. List production-critical env var names (not values). Service role is not NEXT_PUBLIC.
3. Name migration order and rollback (or expand/contract reverse).
4. List testing-qa commands actually run. Smoke the primary path.
5. User-visible changes need browser-qa desktop and mobile screenshot paths.
6. Return go or no-go. Do not imply go by omitting the word.

Reject: "LGTM, ship it" with no env, rollback, or commands; user-visible without screenshot paths; skipping rollback because it is a small change.

Required outputs: verdict, target, commands, env names, rollback, browser-qa paths if UI, gaps.
"""
