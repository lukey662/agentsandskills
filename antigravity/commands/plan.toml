name = "plan"
description = "Plan the change, name the owning agent, and print a paste-ready USER_GUIDE prompt."

prompt = """
Run the planning skill.

Canonical source: skills/planning/SKILL.md (or .cursor/skills/planning/SKILL.md). Prompts: USER_GUIDE.md. You do not run the other agents.

Workflow:
1. Read enough of the repo to name affected routes, tables, and auth boundaries.
2. Pick one owner: app-engineer, security, design, qa, or copy.
3. Name extra reviewers and which screenshots QA must capture.
4. Print a fenced ```text block from USER_GUIDE for the owner. Print extra fences for extra reviewers.
5. If owner is Design and DESIGN.md is missing or TBD, print the Design setup prompt.
6. If owner is QA (or QA is an extra reviewer), print the screenshot prompt.
7. If this is a release go/no-go, print the ship prompt.

Reject: finishing without a fenced paste; "ask @qa next" with no prompt text; implementing.

Required outputs: owner, extra reviewers, skills, screenshots, at least one copy-paste block.
"""
